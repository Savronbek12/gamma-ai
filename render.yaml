# Render.com uchun sozlama (Blueprint)
services:
  - type: web
    name: gamma-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false   # Render panelida qo'lda kiritiladi (maxfiy)
      - key: GEMINI_API_KEY
        sync: false   # rasm yaratish uchun (ixtiyoriy)
      - key: RATE_LIMIT_PER_MINUTE
        value: "15"
